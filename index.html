<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnatoDraw</title>
    <style>
      body {
        margin: 0; padding: 24px;
        background: #0f1b26; color: #fff;
        font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: #93b2c8; font-size: 13px; margin: 0 0 20px; }
      a.card {
        display: block; max-width: 420px;
        margin: 0 0 12px; padding: 16px;
        background: #16293a; border-radius: 12px;
        color: #fff; text-decoration: none;
      }
      a.card strong { display: block; font-size: 16px; color: #f0a868; margin-bottom: 4px; }
      a.card span { font-size: 12px; color: #93b2c8; }
      a.card.tool strong { color: #93b2c8; }
    </style>
  </head>
  <body>
    <h1>AnatoDraw</h1>
    <p class="sub">解剖のなぞり描き・ノード接続 学習アプリ（試作）</p>

    <a class="card" href="prototype.html">
      <strong>Level 1 なぞり描き</strong>
      <span>お手本の線をなぞる（動脈の分枝など）</span>
    </a>
    <a class="card" href="prototype-l2.html">
      <strong>Level 2 ノード接続</strong>
      <span>構造をつなぐ（腕・腰・仙骨・頸神経叢）</span>
    </a>
    <a class="card tool" href="tracer.html">
      <strong>お手本トレースツール（出題者用）</strong>
      <span>線・ノード・エッジを作ってJSONを書き出す</span>
    </a>
  </body>
</html>
